name: Validate SQL contracts PostgreSQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caja_contract_test
          POSTGRES_USER: caja_ci
          POSTGRES_PASSWORD: caja_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caja_ci -d caja_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Create isolated contract databases
        env:
          DATABASE_URL: postgresql://caja_ci:caja_ci_only_password@localhost:5432/caja_contract_test
        run: |
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE caja_catalog_contract;
          CREATE DATABASE caja_ledger_contract;
          CREATE DATABASE caja_reserva_contract;
          CREATE DATABASE caja_gift_card_reserva_contract;
          CREATE DATABASE caja_conciliacion_v2_contract;
          SQL

      # El agregado local equivalente de contratos existentes es: npm run test:sql

      - name: Validate catalog snapshot contract
        env:
          DATABASE_URL: postgresql://caja_ci:caja_ci_only_password@localhost:5432/caja_catalog_contract
        run: node tests/run-catalog-snapshot-postgres-validation.mjs

      - name: Validate payment ledger contract
        env:
          DATABASE_URL: postgresql://caja_ci:caja_ci_only_password@localhost:5432/caja_ledger_contract
        run: node tests/run-pagos-ledger-postgres-validation.mjs

      - name: Validate reservation-to-attention contract
        env:
          DATABASE_URL: postgresql://caja_ci:caja_ci_only_password@localhost:5432/caja_reserva_contract
        run: node tests/run-reserva-atencion-postgres-validation.mjs

      - name: Validate Gift Card reservation contract
        env:
          DATABASE_URL: postgresql://caja_ci:caja_ci_only_password@localhost:5432/caja_gift_card_reserva_contract
        run: node tests/run-gift-card-reserva-postgres-validation.mjs

      - name: Validate Conciliación V2 contract
        env:
          DATABASE_URL: postgresql://caja_ci:caja_ci_only_password@localhost:5432/caja_conciliacion_v2_contract
        run: node tests/run-conciliacion-v2-postgres-validation.mjs
